<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Chat Widget</title>
</head>
<body style="background-color: aquamarine;">
    <!-- Other content of the host page -->

    <!-- Embed the chat widget -->
    <iframe id="chatIframe" src="index.html" style="width: 100px; height: 100px; border: none; position: fixed; right: 0px; bottom: 0px; z-index: 99999999;"></iframe>
    <script>
        window.addEventListener('message', function(event) {
            if (event.data.action === 'expand') {
                document.getElementById('chatIframe').style.height = '730px';
                document.getElementById('chatIframe').style.width = '440px';
            } else if (event.data.action === 'minimize') {
                setTimeout(function() {
                    document.getElementById('chatIframe').style.height = '100px';
                    document.getElementById('chatIframe').style.width = '100px';
                    }, 300);
            }
        });
    </script>
</body>
</html>
